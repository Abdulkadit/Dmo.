<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rashmii</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

* {margin:0; padding:100;}
html, body {height:100%; touch-action:none;}
body {
  overflow:hidden;
  display:flex;
  font-family:"Pacifico", sans-serif;
  background:#21071e;
  perspective:10000px;
  transform-style:preserve-3d;
}

/* Canvas for fireworks + hearts */
#canvas {
  position: fixed;
  top:110;
  left:110;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* Carousel */
#drag-container, #spin-container {
  position: relative;
  display:flex;
  margin:auto;
  transform-style:preserve-3d;
  transform:rotateX(-10deg);
  z-index:1;
}
#drag-container img {
  transform-style:preserve-3d;
  position:absolute;
  left:0;
  object-fit:cover;
  width:160px;
  height:220px;
  top:0;
  line-height:200px;
  font-size:50px;
  text-align:center;
  box-shadow:0 0 8px #fff;
  border:4px solid #fff;
  border-top-left-radius:30px;
  border-top-right-radius:30px;
  transition: all 1.90s ease;
}
#drag-container img:hover {
  box-shadow:0 0 20px #fffd;
  transform: scale(1.1);
}
#drag-container p {
  line-height:116px;
  position:absolute;
  top:100%;
  left:50%;
  transform:translate(-50%,-50%) rotateX(90deg);
  color:white;
  font-size:3vw;
}
.button {
  height:121px;
  padding:10px 30px;
  background:url('./images/Message.png') center/contain no-repeat;
  border-radius:20px;
  cursor:pointer;
  border:none;
  position:absolute;
  top:13%;
  left:24%;
  opacity:0;
  animation:showUp 1s forwards;
  animation-delay:5s;
  transition:all .3s ease-in-out;
}
.button:hover {transform:scale(2.1);}
@keyframes showUp {to{opacity:1;}}

#ground {
  width:900px; height:900px;
  position:absolute;
  top:100%;
  left:50%;
  transform:translate(-50%,-50%) rotateX(90deg);
  background:radial-gradient(circle farthest-side,#9993,transparent);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="drag-container">
  <div id="spin-container">
    <img src="https://i.ibb.co/9mxK5Tn3/IMG-20250907-WA0021.jpg" alt="">
    <img src="https://i.ibb.co/MDtJC0bS/1758638279837.jpg" alt="">
    <img src="https://i.ibb.co/PnZybdL/1758282879566.jpg" alt="">
    <img src="https://i.ibb.co/QjJdpqQW/1758282788303.jpg" alt="">
    <img src="https://i.ibb.co/RT3ZdQHZ/1757690436450.jpg" alt="">
    <img src="https://i.ibb.co/CsKBrWbg/FB-IMG-1757426035581.jpg" alt="">
    <p>Happy <span>Birthday Rashmii</span></p>
    <button class="button" onclick="confetti()"></button>
  </div>
  <div id="ground"></div>
</div>

<script src='https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js'></script>
<script>
// ===== Carousel 3D =====
var radius=240, autoRotate=true, rotateSpeed=-60, imgWidth=160, imgHeight=220;

setTimeout(init,1000);
var odrag=document.getElementById('drag-container');
var ospin=document.getElementById('spin-container');
var aImg=ospin.getElementsByTagName('img');
var aEle=[...aImg];

ospin.style.width=imgWidth+"px";
ospin.style.height=imgHeight+"px";
var ground=document.getElementById('ground');
ground.style.width=radius*3+"px";
ground.style.height=radius*3+"px";

function init(delayTime){
  for(var i=0;i<aEle.length;i++){
    aEle[i].style.transform="rotateY("+(i*(360/aEle.length))+"deg) translateZ("+radius+"px)";
    aEle[i].style.transition="transform 1s";
    aEle[i].style.transitionDelay = delayTime || (aEle.length-i)/4+"s";
  }
}

var tX=0,tY=10,desX=0,desY=0;
function applyTranform(obj){
  if(tY>180) tY=180;
  if(tY<0) tY=0;
  obj.style.transform="rotateX("+(-tY)+"deg) rotateY("+tX+"deg)";
}
function playSpin(yes){ ospin.style.animationPlayState=(yes?'running':'paused'); }
if(autoRotate){ ospin.style.animation = `${rotateSpeed>0?'spin':'spinRevert'} ${Math.abs(rotateSpeed)}s infinite linear`; }

document.onpointerdown=function(e){
  clearInterval(odrag.timer); e=e||window.event;
  var sX=e.clientX, sY=e.clientY;
  this.onpointermove=function(e){
    e=e||window.event; var nX=e.clientX, nY=e.clientY;
    desX=nX-sX; desY=nY-sY;
    tX+=desX*0.1; tY+=desY*0.1;
    applyTranform(odrag); sX=nX; sY=nY;
  };
  this.onpointerup=function(){
    odrag.timer=setInterval(function(){
      desX*=0.95; desY*=0.95;
      tX+=desX*0.1; tY+=desY*0.1;
      applyTranform(odrag); playSpin(false);
      if(Math.abs(desX)<0.5 && Math.abs(desY)<0.5){ clearInterval(odrag.timer); playSpin(true);}
    },17);
    this.onpointermove=this.onpointerup=null;
  };
  return false;
};
document.onmousewheel=function(e){ e=e||window.event; radius+=(e.wheelDelta/20||-e.detail); init(1); };

// ===== Canvas Fireworks + Hearts =====
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
function random(min,max){return Math.random()*(max-min)+min;}
class Firework{constructor(x,y){this.x=x;this.y=y;this.radius=random(2,4);this.color=`hsl(${random(0,360)},100%,50%)`;this.vx=random(-3,3);this.vy=random(-3,3);this.life=100;}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}update(){this.x+=this.vx;this.y+=this.vy;this.life--;}}
class Heart{constructor(x,y){this.x=x;this.y=y;this.size=random(20,40);this.color='red';this.vy=random(-2,-1);this.opacity=1;}draw(){ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.bezierCurveTo(this.x-this.size/2,this.y-this.size/2,this.x-this.size,this.y+this.size/3,this.x,this.y+this.size);ctx.bezierCurveTo(this.x+this.size,this.y+this.size/3,this.x+this.size/2,this.y-this.size/2,this.x,this.y);ctx.fillStyle=this.color;ctx.globalAlpha=this.opacity;ctx.fill();ctx.globalAlpha=1;}update(){this.y+=this.vy;this.opacity-=0.01;}}

let fireworks=[],hearts=[];
function animateCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(Math.random()<0.1) fireworks.push(new Firework(random(0,canvas.width),random(0,canvas.height)));
  if(Math.random()<0.05) hearts.push(new Heart(random(0,canvas.width),canvas.height));
  fireworks.forEach((f,i)=>{f.draw();f.update(); if(f.life<=0) fireworks.splice(i,1);});
  hearts.forEach((h,i)=>{h.draw();h.update(); if(h.opacity<=0) hearts.splice(i,1);});
  requestAnimationFrame(animateCanvas);
}
animateCanvas();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});
</script>
</body>
</html>
